# ========================================
# Refinr - configuration template
# ========================================
# Copy this file to application.properties (git-ignored):
#   cp src/main/resources/application-example.properties src/main/resources/application.properties
# Never put real values here: every secret / personal value is read from an
# environment variable or from the local .env file at the repository root
# (see .env.example). Real environment variables take precedence over .env.

# Load the local .env (run from backend/ -> ../.env, run from repo root -> ./.env)
spring.config.import=optional:file:../.env[.properties],optional:file:./.env[.properties]

# Application
spring.application.name=refinr
server.port=8080

# Document source of this instance (one per instance): confluence (default), bookstack or xwiki.
# Unknown value or missing property of the chosen source: startup fails with an explicit message.
source.provider=${SOURCE_PROVIDER:confluence}

# Confluence Configuration (source.provider=confluence; not needed for another source)
confluence.base-url=${CONFLUENCE_BASE_URL:https://your-site.atlassian.net}
confluence.username=${CONFLUENCE_USERNAME:you@example.com}
confluence.token=${CONFLUENCE_TOKEN:}
confluence.space-key=SPACE

# BookStack Configuration (source.provider=bookstack; REST API token of a dedicated account, see README)
bookstack.base-url=${BOOKSTACK_BASE_URL:https://bookstack.example.com}
bookstack.token-id=${BOOKSTACK_TOKEN_ID:}
bookstack.token-secret=${BOOKSTACK_TOKEN_SECRET:}
# Address used for the links in the web UI; empty = bookstack.base-url
bookstack.web-url=${BOOKSTACK_WEB_URL:}

# XWiki Configuration (source.provider=xwiki; dedicated technical account, HTTP Basic: use HTTPS, see README)
xwiki.base-url=${XWIKI_BASE_URL:https://xwiki.example.com}
xwiki.username=${XWIKI_USERNAME:}
xwiki.password=${XWIKI_PASSWORD:}
# Address used for the links in the web UI; empty = xwiki.base-url
xwiki.web-url=${XWIKI_WEB_URL:}
# Wiki to read (main wiki by default)
xwiki.wiki=${XWIKI_WIKI:xwiki}

# Issue tracker of this instance (one per instance): jira (default) or openproject.
# Unknown value or missing property of the chosen tracker: startup fails with an explicit message.
tracker.provider=${TRACKER_PROVIDER:jira}

# Jira Configuration
jira.base-url=${JIRA_BASE_URL:https://your-site.atlassian.net}
jira.username=${JIRA_USERNAME:you@example.com}
jira.token=${JIRA_TOKEN:}
jira.project-key=${JIRA_PROJECT_KEY:PROJ}
# false pour un projet team-managed (next-gen) : il n'a pas de champ priority
jira.priority-enabled=${JIRA_PRIORITY_ENABLED:true}
# Champ Jira des story points (ex. customfield_10016, propre a chaque instance) ; vide = story points non envoyes
jira.story-points-field=${JIRA_STORY_POINTS_FIELD:}

# OpenProject Configuration (tracker.provider=openproject; API v3, account key from My account > Access tokens)
openproject.base-url=${OPENPROJECT_BASE_URL:}
openproject.api-key=${OPENPROJECT_API_KEY:}
# Web address used only for the links to the created work packages; empty = base-url (set it when Refinr reaches
# OpenProject through an internal address, e.g. http://host.docker.internal:8090 in Docker)
openproject.web-url=${OPENPROJECT_WEB_URL:}
# Default project: identifier (e.g. my-project) or numeric id
openproject.project=${OPENPROJECT_PROJECT:}
openproject.types.epic=${OPENPROJECT_TYPE_EPIC:Epic}
openproject.types.story=${OPENPROJECT_TYPE_STORY:User story}
openproject.types.subtask=${OPENPROJECT_TYPE_SUBTASK:Task}
# List custom field holding the verdict, with the options ai-ready and validation-necessaire
openproject.readiness-field=${OPENPROJECT_READINESS_FIELD:Agent readiness}
# Story points on user stories only (Backlogs module)
openproject.story-points-enabled=${OPENPROJECT_STORY_POINTS_ENABLED:true}
openproject.priority-enabled=${OPENPROJECT_PRIORITY_ENABLED:true}

# ========================================
# LLM providers (analysis and ai-ready verdict)
# ========================================
# provider : anthropic | google | openai-compatible
#   openai-compatible : OpenAI, DeepSeek, Mistral, Groq, OpenRouter, Ollama, LiteLLM, vLLM...
#   (base-url avec la version de l'API, ex. https://api.openai.com/v1 ou http://localhost:11434/v1)
# Sans provider : Ollama local (gratuit) via son API compatible OpenAI (http://localhost:11434/v1, qwen3:8b).
# Avec un provider explicite, aucun defaut Ollama : base-url vide = URL officielle (anthropic, google),
# base-url obligatoire pour openai-compatible (sinon echec au demarrage) ; model toujours obligatoire.
refinr.llm.analysis.provider=${LLM_ANALYSIS_PROVIDER:}
refinr.llm.analysis.base-url=${LLM_ANALYSIS_BASE_URL:}
refinr.llm.analysis.model=${LLM_ANALYSIS_MODEL:}
refinr.llm.analysis.api-key=${LLM_ANALYSIS_API_KEY:}
refinr.llm.analysis.timeout=${LLM_ANALYSIS_TIMEOUT:300s}
refinr.llm.analysis.max-output-tokens=${LLM_ANALYSIS_MAX_OUTPUT_TOKENS:32768}
# openai-compatible : json_schema (defaut) | json_object (ex. DeepSeek) | none
#refinr.llm.analysis.json-mode=json_schema
# Temperature : vide = non envoyee (defaut du fournisseur ; requis par les modeles OpenAI a raisonnement)
refinr.llm.analysis.temperature=${LLM_ANALYSIS_TEMPERATURE:0.2}
# openai-compatible : nom du parametre de limite de sortie : max_tokens | max_completion_tokens (modeles OpenAI a raisonnement) | none
refinr.llm.analysis.max-tokens-param=${LLM_ANALYSIS_MAX_TOKENS_PARAM:max_tokens}
# openai-compatible : proprietes ajoutees au corps de la requete (valeur vide = non envoyee).
# reasoning_effort=none desactive la reflexion des modeles Ollama (qwen3...) : sans elle, l'analyse peut depasser le timeout.
# Laisser vide pour un fournisseur qui ne le connait pas (ex. modeles OpenAI sans raisonnement).
refinr.llm.analysis.extra-body.reasoning_effort=${LLM_ANALYSIS_REASONING_EFFORT:}
# Nouveaux essais sur 429, 5xx et fournisseur injoignable : base-delay * multiplier^(n-1), +/- jitter, plafonne a max-delay
# (defauts : 2 s puis 8 s, +/- 20 %) ; un Retry-After du fournisseur est prioritaire, plafonne a max-delay. Idem pour verdict.
refinr.llm.analysis.max-retries=2
refinr.llm.analysis.retry-base-delay=2s
refinr.llm.analysis.retry-multiplier=4
refinr.llm.analysis.retry-jitter=0.2
refinr.llm.analysis.retry-max-delay=30s

# Relances quand la sortie du modele ne respecte pas le schema JSON (avec la liste des erreurs), puis erreur 502
refinr.llm.max-repair-attempts=2

# Verdict ai-ready / validation-necessaire confie a un fournisseur distinct (optionnel).
# provider vide = le verdict vient de l'analyse ; create-jira et reassess-story utilisent alors le fournisseur d'analyse.
# Le label ai-ready permet ensuite d'alimenter un agent de code via JQL : labels = "ai-ready"
refinr.llm.verdict.provider=${LLM_VERDICT_PROVIDER:}
refinr.llm.verdict.base-url=${LLM_VERDICT_BASE_URL:}
refinr.llm.verdict.model=${LLM_VERDICT_MODEL:}
refinr.llm.verdict.api-key=${LLM_VERDICT_API_KEY:}
refinr.llm.verdict.timeout=${LLM_VERDICT_TIMEOUT:90s}
refinr.llm.verdict.max-output-tokens=${LLM_VERDICT_MAX_OUTPUT_TOKENS:4096}
refinr.llm.verdict.extra-body.reasoning_effort=${LLM_VERDICT_REASONING_EFFORT:}
refinr.llm.verdict.temperature=${LLM_VERDICT_TEMPERATURE:0.1}
refinr.llm.verdict.max-tokens-param=${LLM_VERDICT_MAX_TOKENS_PARAM:max_tokens}
# Stories jugees par appel de verdict (1 = un appel par story)
refinr.llm.verdict.batch-size=${LLM_VERDICT_BATCH_SIZE:10}
# Cache des verdicts reussis (par contenu de story, fournisseur, modele et version du prompt) ; ttl 0s = sans cache
refinr.llm.verdict.cache.ttl=24h
refinr.llm.verdict.cache.max-entries=1000

# Health check (/api/v1/health) : resultat garde en cache pour ne pas solliciter les API a chaque affichage
refinr.health.cache-ttl=${HEALTH_CACHE_TTL:45s}

# Document fourni en texte (champ content d'analyze-preview / analyze-and-create) : taille maximale en caracteres
# Unicode, titre compris ; au-dela -> 413. Reste sous le client_max_body_size 5m du proxy nginx du frontend.
refinr.document.max-content-chars=${DOCUMENT_MAX_CONTENT_CHARS:200000}

# ========================================
# HTTP security
# ========================================
# Origines autorisees a appeler l'API depuis un navigateur (CORS), separees par des virgules ; '*' refuse.
# Vide = aucune origine tierce (meme origine uniquement, ex. frontend servi derriere le proxy /api).
refinr.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
# Hotes acceptes dans l'en-tete Host (protection contre le DNS rebinding), separes par des virgules, port ignore ;
# '*' refuse. Ajouter le nom DNS ou l'IP par lesquels le service est joint en reseau (meme liste que le frontend).
refinr.security.allowed-hosts=${REFINR_ALLOWED_HOSTS:localhost,127.0.0.1,[::1]}
# Cle d'API optionnelle : si renseignee, chaque requete /api/** doit envoyer l'en-tete X-API-Key (sauf /api/v1/health).
# Vide = desactivee (poste local).
refinr.security.api-key=${REFINR_API_KEY:}
# Taille maximale du corps d'une requete, en octets (defaut 5 Mio = client_max_body_size 5m du proxy nginx) ; au-dela -> 413.
# S'applique aussi a un corps sans Content-Length (chunked), lu au plus jusqu'a cette limite.
refinr.http.max-body-bytes=${HTTP_MAX_BODY_BYTES:5242880}

# Logging
logging.level.root=INFO
logging.level.fr.heliocraft=DEBUG
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
