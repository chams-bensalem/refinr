# ========================================
# Refinr - configuration template
# ========================================
# Copy this file to application.properties (git-ignored):
#   cp src/main/resources/application-example.properties src/main/resources/application.properties
# Never put real values here: every secret / personal value is read from an
# environment variable or from the local .env file at the repository root
# (see .env.example). Real environment variables take precedence over .env.

# Load the local .env (run from backend/ -> ../.env, run from repo root -> ./.env)
spring.config.import=optional:file:../.env[.properties],optional:file:./.env[.properties]

# Application
spring.application.name=refinr
server.port=8080

# Confluence Configuration
confluence.base-url=${CONFLUENCE_BASE_URL:https://your-site.atlassian.net}
confluence.username=${CONFLUENCE_USERNAME:you@example.com}
confluence.token=${CONFLUENCE_TOKEN:}
confluence.space-key=SPACE

# Jira Configuration
jira.base-url=${JIRA_BASE_URL:https://your-site.atlassian.net}
jira.username=${JIRA_USERNAME:you@example.com}
jira.token=${JIRA_TOKEN:}
jira.project-key=${JIRA_PROJECT_KEY:PROJ}
# false pour un projet team-managed (next-gen) : il n'a pas de champ priority
jira.priority-enabled=${JIRA_PRIORITY_ENABLED:true}

# ========================================
# AI Provider Configuration
# ========================================
# Analyse des documents : ollama (local, gratuit) ou gemini (API Google, cle gemini.api-key)
ai.provider=${AI_PROVIDER:ollama}

# Ollama Configuration (local, 100% GRATUIT)
ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
ollama.model=${OLLAMA_MODEL:qwen3:8b}

# Verdict ai-ready / validation-necessaire (analyse et reevaluation reassess-story) : peut etre confie
# a un fournisseur distinct (ex. litellm = proxy OpenAI-compatible) ; la structure Epic/Story/Task reste
# sur ai.provider. Vide = meme fournisseur que ai.provider.
# Le label ai-ready permet ensuite d'alimenter un agent de code via JQL : labels = "ai-ready"
ai.verdict.provider=${AI_VERDICT_PROVIDER:}
ai.verdict.base-url=${AI_VERDICT_BASE_URL:http://localhost:4000}
ai.verdict.model=${AI_VERDICT_MODEL:gemini-2.5-flash}
ai.verdict.api-key=${AI_VERDICT_API_KEY:}
# Autres modèles disponibles: mistral:7b, llama3.1:70b, codellama:13b

# Groq Configuration (cloud, GRATUIT jusqu'à 14,400 req/jour)
groq.api-key=${GROQ_API_KEY:}
groq.model=llama-3.1-8b-instant
# Autres modèles: llama-3.1-70b-versatile, mixtral-8x7b-32768

# Anthropic Claude API (payant, meilleure qualité)
anthropic.api-key=${ANTHROPIC_API_KEY:}

# Jackson 3 (Spring Boot 4) : conserver les defauts Jackson 2 - PROVISOIRE, retrait prevu en phase 4 (cf. DECISIONS.md)
spring.jackson.use-jackson2-defaults=true

# Logging
logging.level.root=INFO
logging.level.fr.heliocraft=DEBUG
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# ========================================
# Gemini Configuration (GRATUIT - 1500 req/jour)
# ========================================
gemini.api-key=${GEMINI_API_KEY:}
# Modele Gemini de l'analyse (et du health check)
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
