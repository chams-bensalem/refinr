name: commit-messages

on:
  pull_request:

permissions:
  contents: read

jobs:
  no-ai-attribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Refuse AI attribution in PR commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          bad=0
          for sha in $(git rev-list "$BASE_SHA..$HEAD_SHA"); do
            if git log -1 --format=%B "$sha" | grep -qiE 'Co-Authored-By:[[:space:]]*Claude|Generated with Claude Code|Claude-Session:'; then
              echo "::error::Commit $sha contains an AI attribution trailer"
              bad=1
            fi
          done
          exit $bad
