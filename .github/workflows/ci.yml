name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend tests (JDK 25)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # maven-toolchains-plugin selects this JDK 25 for compilation and tests
      - name: Test
        working-directory: backend
        run: mvn -B -ntp verify

  frontend:
    name: frontend lint + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Build
        working-directory: frontend
        run: npm run build

  license-headers:
    name: SPDX license headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Fails if a backend/frontend source file has no "SPDX-License-Identifier: AGPL-3.0-only" header
      - name: Check
        run: scripts/check-spdx.sh

  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # gitleaks CLI from the official release (checksum verified) rather than gitleaks-action,
      # which requires a license for organization-owned repositories
      - name: Install gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" "$base/$archive"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${archive}\$" checksums.txt | sha256sum -c -
          tar -xzf "$archive" gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          rm -f "$archive" checksums.txt
          gitleaks version
      - name: Scan the full git history
        run: gitleaks detect --source . --redact --no-banner --verbose

  images:
    name: image ${{ matrix.image }} (linux/amd64 + linux/arm64)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.image }}
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  compose-smoke:
    name: docker compose up + health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No .env in CI: the stack starts with the dummy defaults, external services are reported DOWN
      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Backend health
        run: curl -fsS http://localhost:8080/api/v1/health && echo
      - name: Frontend and API proxy
        run: |
          curl -fsS -o /dev/null http://localhost:3000/
          curl -fsS http://localhost:3000/config.js
          curl -fsS http://localhost:3000/api/v1/health/live && echo
      # DNS rebinding protection: a Host that is not in REFINR_ALLOWED_HOSTS must be refused on both sides
      - name: Host allowlist
        run: |
          set -u
          for host in localhost:3000 127.0.0.1:3000 '[::1]:3000'; do
            curl -fsS -o /dev/null -H "Host: $host" http://localhost:3000/healthz && echo "frontend accepts Host $host"
          done
          if curl -sS -o /dev/null -H 'Host: evil.example' http://localhost:3000/; then
            echo "::error::frontend accepted Host evil.example"; exit 1
          fi
          echo "frontend closes the connection for Host evil.example (nginx 444)"
          if curl -sS -o /dev/null -H 'Host: evil.example' http://localhost:3000/api/v1/health; then
            echo "::error::frontend proxied a request with Host evil.example"; exit 1
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: evil.example' http://localhost:8080/api/v1/health/live)
          test "$code" = 403 || { echo "::error::backend answered $code for Host evil.example"; exit 1; }
          echo "backend answers 403 for Host evil.example"
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: [::1]:8080' http://localhost:8080/api/v1/health/live)
          test "$code" = 200 && echo "backend accepts Host [::1]:8080"
      - name: Logs
        if: always()
        run: docker compose logs --no-color
      - name: Stop
        if: always()
        run: docker compose down -v
