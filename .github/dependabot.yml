# Automated dependency updates: one weekly PR per ecosystem, minor and patch updates grouped.
version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    groups:
      maven-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Major upgrades kept manual (no frontend tests yet, see DECISIONS.md)
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: react-router-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: tailwindcss
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule:
      interval: weekly
    ignore:
      # The backend stays on Java 25 (LTS, required by the project): no Temurin JRE 26+ runtime image.
      # JDK 25 patch releases still arrive through the floating 25-jre-alpine tag.
      - dependency-name: eclipse-temurin
        versions: [">= 26"]
      # maven:3.9-eclipse-temurin-25 (build image) carries the JDK in its tag suffix, which Dependabot keeps:
      # it may propose a newer Maven on the same JDK 25, never another JDK. A JDK change is a manual PR
      # (Dockerfile + toolchain range [25,26) of pom.xml).

  # Image tags of docker-compose.yml (ollama/ollama)
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly

  # Actions are pinned by commit SHA: Dependabot updates the SHA and its version comment
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
