# Refinr - local stack: backend (Spring Boot) + frontend (static, nginx), optional local Ollama.
#
#   cp .env.example .env          # then fill in your Confluence / Jira / LLM values
#   docker compose up -d --build  # UI: http://localhost:3000  API: http://localhost:8080/api/v1/health
#   docker compose --profile ollama up -d --build   # + a local Ollama (set LLM_ANALYSIS_BASE_URL=http://ollama:11434/v1)
#
# Configuration is read from .env (secrets never go in this file). Ports are bound to 127.0.0.1 only.
# Inside a container, "localhost" is the container itself: an Ollama running on your machine is reached at
# http://host.docker.internal:11434/v1.

name: refinr

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped

services:
  backend:
    <<: *hardening
    build:
      context: ./backend
    image: ${REFINR_BACKEND_IMAGE:-refinr-backend:local}
    env_file:
      - path: .env
        required: false
    environment:
      # Optional API key (empty = disabled), shared with the frontend proxy below
      REFINR_API_KEY: ${REFINR_API_KEY:-}
      # Accepted Host headers (DNS rebinding protection), same list for the frontend
      REFINR_ALLOWED_HOSTS: ${REFINR_ALLOWED_HOSTS:-localhost,127.0.0.1,[::1]}
    # Read-only root filesystem: Tomcat's work directory lives in /tmp
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=0700
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - 127.0.0.1:${REFINR_BACKEND_PORT:-8080}:8080
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
        required: false

  frontend:
    <<: *hardening
    build:
      context: ./frontend
    image: ${REFINR_FRONTEND_IMAGE:-refinr-frontend:local}
    environment:
      REFINR_BACKEND_URL: http://backend:8080
      REFINR_API_BASE_URL: ${REFINR_API_BASE_URL:-/api/v1}
      # Same key as the backend (from .env): added by the proxy, never sent to the browser
      REFINR_API_KEY: ${REFINR_API_KEY:-}
      REFINR_ALLOWED_HOSTS: ${REFINR_ALLOWED_HOSTS:-localhost,127.0.0.1,[::1]}
    # Read-only root filesystem: nginx (uid 101) writes its generated config and temp files to tmpfs only
    tmpfs:
      - /tmp:uid=101,gid=101,mode=0700
      - /var/cache/nginx:uid=101,gid=101,mode=0700
      - /etc/nginx/conf.d:uid=101,gid=101,mode=0755
    ports:
      - 127.0.0.1:${REFINR_FRONTEND_PORT:-3000}:8080
    depends_on:
      backend:
        condition: service_healthy

  # --- Optional local LLM: docker compose --profile ollama up -d ---
  ollama:
    profiles: [ollama]
    image: ollama/ollama:0.40.16
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: [CMD, ollama, list]
      interval: 10s
      timeout: 5s
      retries: 12

  ollama-pull:
    profiles: [ollama]
    image: ollama/ollama:0.40.16
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: [ollama, pull, "${LLM_ANALYSIS_MODEL:-qwen3:8b}"]
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  ollama-models:
